<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zocial — социальная сеть</title>
    <style>
        :root {
            --primary: #2563eb; --primary-light: #60a5fa; --primary-dark: #1d4ed8;
            --accent: #f97316; --bg: #0a0a1a; --surface: #1a1a2e; --surface2: #16213e;
            --text: #ffffff; --text-secondary: #94a3b8;
            --border: rgba(37,99,235,0.15); --radius: 20px; --radius-sm: 14px;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
            --gold: #f59e0b; --green: #10b981;
        }
        .light {
            --bg: #f1f5f9; --surface: #ffffff; --surface2: #e2e8f0; --text: #1e293b;
            --text-secondary: #64748b; --border: rgba(37,99,235,0.2);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden; transition:background 0.5s,color 0.5s; }
        .app { width:100%; max-width:430px; height:100vh; height:100dvh; background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden; transition:background 0.5s; }
        
        .topbar { padding:12px 20px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; z-index:10; }
        .topbar .logo { font-size:1.5rem; font-weight:800; color:var(--primary-light); }
        .icon-btn { width:38px; height:38px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); color:var(--primary-light); font-size:1.2rem; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        
        .pages { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
        .pages::-webkit-scrollbar { width:0; }
        .page { display:none; padding:16px; animation:fadeIn 0.3s; }
        .page.active { display:block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        
        .post { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:14px; border:1px solid var(--border); animation:popIn 0.4s ease; }
        @keyframes popIn { from{opacity:0;transform:scale(0.8) translateY(20px);} to{opacity:1;transform:scale(1) translateY(0);} }
        .avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--primary-dark),var(--primary-light)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; flex-shrink:0; overflow:hidden; cursor:pointer; }
        .avatar img { width:100%; height:100%; object-fit:cover; }
        .uname { font-weight:600; font-size:0.95rem; color:var(--primary-light); cursor:pointer; }
        .actions { display:flex; gap:20px; padding-top:8px; border-top:1px solid var(--border); }
        .act-btn { display:flex; align-items:center; gap:6px; font-size:0.85rem; color:var(--primary-light); cursor:pointer; background:none; border:none; padding:6px 10px; border-radius:20px; }
        .act-btn.liked { color:var(--accent); }
        
        .btn { padding:10px 24px; border-radius:25px; border:none; font-weight:600; cursor:pointer; font-size:0.9rem; }
        .btn-p { background:var(--primary); color:white; }
        .btn-o { background:transparent; border:2px solid var(--primary); color:var(--primary-light); }
        
        .navbar { display:flex; background:var(--surface); border-top:1px solid var(--border); padding:8px 10px; padding-bottom:calc(8px + var(--safe-bottom)); }
        .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px; border-radius:16px; cursor:pointer; background:none; border:none; color:var(--primary-light); font-size:0.7rem; font-weight:500; }
        .nav-item .ni { font-size:1.5rem; }
        .nav-item.ac { color:var(--primary); background:var(--surface2); }
        
        .fab { position:fixed; bottom:100px; right:20px; width:56px; height:56px; border-radius:50%; background:var(--primary); color:white; font-size:2rem; border:none; box-shadow:0 8px 24px rgba(37,99,235,0.6); cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:50; animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{box-shadow:0 8px 24px rgba(37,99,235,0.6);} 50%{box-shadow:0 8px 32px rgba(37,99,235,0.9);} }
        .fab.hid { display:none; }
        
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.3s; }
        .modal.open { opacity:1; pointer-events:all; }
        .modal .sh { background:var(--surface); width:100%; max-width:430px; border-radius:24px 24px 0 0; padding:20px; padding-bottom:calc(20px + var(--safe-bottom)); transform:translateY(100%); transition:transform 0.3s; max-height:85vh; overflow-y:auto; }
        .modal.open .sh { transform:translateY(0); }
        .inp { width:100%; padding:14px 18px; border-radius:20px; border:2px solid var(--border); background:var(--surface2); color:var(--text); font-size:0.95rem; outline:none; margin:8px 0; }
        .inp:focus { border-color:var(--primary); }
        
        .chat-scr { position:fixed; inset:0; background:var(--bg); z-index:80; display:flex; flex-direction:column; transform:translateX(100%); transition:transform 0.3s; max-width:430px; margin:0 auto; }
        .chat-scr.open { transform:translateX(0); }
        .chat-nav { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--border); }
        .chat-msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
        .msg { max-width:80%; padding:12px 16px; border-radius:20px; font-size:0.9rem; word-break:break-word; }
        .msg.in { background:var(--surface2); align-self:flex-start; }
        .msg.out { background:var(--primary); color:white; align-self:flex-end; }
        .chat-bar { display:flex; gap:8px; padding:12px 16px; padding-bottom:calc(12px + var(--safe-bottom)); background:var(--surface); }
        
        .like-anim { position:fixed; pointer-events:none; z-index:200; font-size:2rem; animation:lFloat 0.8s ease-out forwards; }
        @keyframes lFloat { 0%{opacity:1;transform:translateY(0) scale(1);} 50%{opacity:1;transform:translateY(-40px) scale(1.3);} 100%{opacity:0;transform:translateY(-80px) scale(0.8);} }
        
        .bank-bal { background:linear-gradient(135deg,#1e3a5f,#162d4a); border-radius:var(--radius); padding:24px; text-align:center; margin:16px 0; border:2px solid #3b82f6; }
        .bank-click { background:radial-gradient(circle,#2563eb,#1d4ed8); border-radius:50%; width:140px; height:140px; margin:16px auto; display:flex; align-items:center; justify-content:center; flex-direction:column; border:3px solid #3b82f6; cursor:pointer; }
        
        @media (min-width:431px) { .app { border-radius:30px; height:95vh; } .chat-scr { border-radius:30px; } }
    </style>
</head>
<body>
    <div class="app" id="app">
        <div class="topbar"><span class="logo">zocial</span><button class="icon-btn" id="searchBtn">🔍</button></div>
        <div class="pages" id="pages">
            <div class="page active" id="page-feed"><div id="feedList"></div></div>
            <div class="page" id="page-video"><h3 style="color:var(--primary-light);">видео</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;" id="videoGrid"></div></div>
            <div class="page" id="page-bank"><div id="bankView"></div></div>
            <div class="page" id="page-chats"><h3 style="color:var(--primary-light);">сообщения</h3><button class="btn btn-o" id="addContactBtn" style="width:100%;margin-bottom:12px;">найти</button><div id="chatList"></div></div>
            <div class="page" id="page-profile"><div id="profileView"></div></div>
            <div class="page" id="page-settings"><div id="settingsView"></div></div>
            <div class="page" id="page-contact"><div id="contactView"></div></div>
        </div>
        <button class="fab hid" id="fabBtn">+</button>
        
        <div class="chat-scr" id="chatScreen">
            <div class="chat-nav"><button class="icon-btn" id="closeChat">←</button><span id="chatName" style="font-weight:600;color:var(--primary-light);">чат</span></div>
            <div class="chat-msgs" id="chatMessages"></div>
            <div class="chat-bar"><input class="inp" id="chatInput" placeholder="сообщение..." style="margin:0;flex:1;"><button class="btn btn-p" id="chatSend" style="width:44px;height:44px;padding:0;border-radius:50%;">➤</button></div>
        </div>
        
        <div class="navbar">
            <button class="nav-item ac" data-page="feed"><span class="ni">🏠</span>лента</button>
            <button class="nav-item" data-page="video"><span class="ni">🎬</span>видео</button>
            <button class="nav-item" data-page="bank"><span class="ni">🏦</span>банк</button>
            <button class="nav-item" data-page="chats"><span class="ni">💬</span>чаты</button>
            <button class="nav-item" data-page="profile"><span class="ni">👤</span>профиль</button>
        </div>
    </div>
    
    <div class="modal" id="postModal"><div class="sh"><h3 style="color:var(--primary-light);margin-bottom:12px;">новый пост</h3><textarea class="inp" id="postText" rows="3" placeholder="что у вас нового?"></textarea><div style="display:flex;gap:10px;margin-top:12px;"><button class="btn btn-o" id="cancelPost">отмена</button><button class="btn btn-p" id="publishPost">опубликовать</button></div></div></div>
    <div class="modal" id="loginModal"><div class="sh"><h3 style="color:var(--primary-light);margin-bottom:12px;">вход / регистрация</h3><input class="inp" id="loginUser" placeholder="email или никнейм"><input class="inp" type="password" id="loginPass" placeholder="пароль"><input class="inp" id="regName" placeholder="имя (для регистрации)" style="display:none;"><div id="loginError" style="color:var(--accent);font-size:0.85rem;margin:4px 0;"></div><div style="display:flex;gap:10px;"><button class="btn btn-p" id="loginBtn" style="flex:1;">войти</button><button class="btn btn-o" id="regBtn" style="flex:1;">регистрация</button></div></div></div>
    <div class="modal" id="commentsModal"><div class="sh"><h3 style="color:var(--primary-light);">комментарии</h3><div id="commentsList"></div><div style="display:flex;gap:8px;margin-top:12px;"><input class="inp" id="commentInput" placeholder="комментарий..." style="margin:0;flex:1;"><button class="btn btn-p" id="commentSend">→</button></div><button class="btn btn-o" id="closeComments" style="width:100%;margin-top:12px;">закрыть</button></div></div>
    <div class="modal" id="editProfileModal"><div class="sh"><h3 style="color:var(--primary-light);">редактировать</h3><div style="text-align:center;margin:12px 0;"><div class="avatar" id="editAv" style="width:80px;height:80px;font-size:2rem;margin:0 auto;"></div></div><input class="inp" id="editName" placeholder="имя"><input class="inp" id="editBio" placeholder="о себе"><div style="display:flex;gap:10px;margin-top:12px;"><button class="btn btn-o" id="cancelEdit">отмена</button><button class="btn btn-p" id="saveEdit">сохранить</button></div></div></div>
    <div class="modal" id="notifModal"><div class="sh"><h3 style="color:var(--primary-light);">уведомления</h3><div id="notifList"></div><button class="btn btn-p" id="closeNotif" style="width:100%;margin-top:12px;">закрыть</button></div></div>
    <div class="modal" id="userListModal"><div class="sh"><h3 style="color:var(--primary-light);" id="userListTitle"></h3><div id="userListContent"></div><button class="btn btn-p" id="closeUserList" style="width:100%;margin-top:12px;">закрыть</button></div></div>

    <script>
    (()=>{
        const K='zc10'; const $=id=>document.getElementById(id);
        const DB={load(){try{const r=localStorage.getItem(K);return r?JSON.parse(r):{users:{},posts:[],videos:[],chats:{},bank:{},subs:{}};}catch(e){return{users:{},posts:[],videos:[],chats:{},bank:{},subs:{}};}},save(d){localStorage.setItem(K,JSON.stringify(d));}};
        let U=null,C=[],N=[],cid=null,All={},posts=[],vids=[],chats={},bank={},subs={},theme='dark',cmtId=null,viewing=null;

        function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);}
        function av(c,u){if(!c)return;c.innerHTML='';if(u?.ai){const i=document.createElement('img');i.src=u.ai;i.style.cssText='width:100%;height:100%;object-fit:cover;';c.appendChild(i);}else c.textContent=(u?.name||u?.un||'?')[0].toUpperCase();}
        function aLike(x,y){const e=document.createElement('div');e.className='like-anim';e.textContent='❤️';e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),800);}
        function sync(){DB.save({users:All,posts:posts,videos:vids,chats:chats,bank:bank,subs:subs});if(U)localStorage.setItem('zc_session',U.un);}

        function go(p){
            document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
            const pg=$('page-'+p);if(pg)pg.classList.add('active');
            document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('ac'));
            const nb=document.querySelector(`[data-page="${p}"]`);if(nb)nb.classList.add('ac');
            $('pages').scrollTop=0;
            $('fabBtn').classList.toggle('hid',!['feed','video'].includes(p));
            if(p==='feed')rf();if(p==='video')rv();if(p==='bank')rb();if(p==='chats')rc();if(p==='profile')rp();if(p==='settings')rs();
        }
        document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>go(n.dataset.page)));

        function openCP(u){viewing=u;go('contact');rCP(u);}
        function rCP(u){
            const ud=All[u];if(!ud){$('contactView').innerHTML='<div style="text-align:center;padding:40px;">не найден</div>';return;}
            const isCon=C.some(c=>c.id===u);const isSub=(subs[U?.un]||[]).includes(u);
            $('contactView').innerHTML=`<div style="display:flex;align-items:center;gap:20px;padding:20px 0;"><div class="avatar" id="ca" style="width:100px;height:100px;font-size:2.8rem;"></div><div><div style="font-size:1.5rem;font-weight:700;">${esc(ud.name)}</div><div style="color:var(--primary-light);">@${esc(u)}</div></div></div><div style="display:flex;gap:10px;margin:16px 0;">${isCon?'<button class="btn btn-p" id="msgBtn">написать</button>':'<button class="btn btn-p" id="addBtn">добавить</button>'}${u!==U?.un?`<button class="btn btn-o" id="subBtn">${isSub?'подписан':'подписаться'}</button>`:''}<button class="btn btn-o" id="backBtn">← назад</button></div>`;
            av($('ca'),ud);
            $('backBtn').addEventListener('click',()=>go('feed'));
            if(isCon)$('msgBtn').addEventListener('click',()=>openChat(u));else $('addBtn').addEventListener('click',()=>{addC(u);openChat(u);});
            const sb=$('subBtn');if(sb)sb.addEventListener('click',function(e){if(!subs[U.un])subs[U.un]=[];const idx=subs[U.un].indexOf(u);if(idx>-1){subs[U.un].splice(idx,1);this.textContent='подписаться';}else{subs[U.un].push(u);this.textContent='подписан';}sync();});
        }

        function rf(){$('feedList').innerHTML='';const s=[...posts].sort((a,b)=>(b.ts||0)-(a.ts||0));if(!s.length)$('feedList').innerHTML='<div style="text-align:center;padding:40px;">нет постов</div>';else s.forEach(p=>rPost(p,$('feedList')));}
        function rPost(p,ct,dl=false){
            const c=document.createElement('div');c.className='post';const lk=p.lb?.includes(U?.un);
            c.innerHTML=`${dl?`<button style="position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text-secondary);" data-pid="${p.id}">✕</button>`:''}<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><div class="avatar" id="pa-${p.id}"></div><div><div class="uname">@${esc(p.un)}</div><div style="font-size:0.7rem;color:var(--text-secondary);">${p.time||''}</div></div></div><div style="margin-bottom:12px;">${esc(p.text||'')}</div><div class="actions"><button class="act-btn lk-btn ${lk?'liked':''}" data-pid="${p.id}">${lk?'❤️':'🤍'} ${p.likes||0}</button><button class="act-btn cmt-btn" data-pid="${p.id}">💬 ${(p.comments||[]).length}</button></div>`;
            av(c.querySelector(`#pa-${p.id}`),All[p.un]||{name:p.un});
            if(p.un!==U?.un){c.querySelector('.avatar').addEventListener('click',()=>openCP(p.un));c.querySelector('.uname').addEventListener('click',()=>openCP(p.un));}
            ct.appendChild(c);
            if(dl)c.querySelector('[data-pid]').addEventListener('click',e=>{e.stopPropagation();if(confirm('удалить?')){posts=posts.filter(x=>x.id!==p.id);sync();renderAll();}});
            c.querySelector('.lk-btn').addEventListener('click',function(e){if(!p.lb)p.lb=[];p.likes=p.likes||0;const idx=p.lb.indexOf(U.un);if(idx>-1){p.lb.splice(idx,1);p.likes--;this.classList.remove('liked');this.innerHTML=`🤍 ${p.likes}`;}else{p.lb.push(U.un);p.likes++;this.classList.add('liked');this.innerHTML=`❤️ ${p.likes}`;const r=this.getBoundingClientRect();aLike(r.left+r.width/2-16,r.top-20);}sync();});
            c.querySelector('.cmt-btn').addEventListener('click',()=>openComments(p.id));
        }
        function openComments(pid){const p=[...posts,...vids].find(x=>x.id===pid);if(!p)return;cmtId=pid;$('commentsList').innerHTML='';if(!p.comments?.length){$('commentsList').innerHTML='<div style="text-align:center;padding:20px;">нет</div>';}else{p.comments.forEach((c,i)=>{const d=document.createElement('div');d.style.cssText='display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);';d.innerHTML=`<div class="avatar" style="width:32px;height:32px;font-size:0.75rem;">${(c.author||'?')[0]}</div><div><div class="uname" style="font-size:0.85rem;">@${esc(c.author)}</div><div style="font-size:0.85rem;">${esc(c.text)}</div></div>`;$('commentsList').appendChild(d);});}$('commentInput').value='';$('commentsModal').classList.add('open');}
        $('closeComments').addEventListener('click',()=>$('commentsModal').classList.remove('open'));
        $('commentSend').addEventListener('click',()=>{const t=$('commentInput').value.trim();if(!t||!cmtId)return;const p=[...posts,...vids].find(x=>x.id===cmtId);if(!p)return;if(!p.comments)p.comments=[];p.comments.push({author:U.un,text:t});$('commentInput').value='';sync();openComments(cmtId);renderAll();});

        function rv(){$('videoGrid').innerHTML='';if(!vids.length){$('videoGrid').innerHTML='<div style="text-align:center;padding:40px;grid-column:1/-1;">нет видео</div>';return;}[...vids].sort((a,b)=>(b.ts||0)-(a.ts||0)).forEach(v=>{const c=document.createElement('div');c.style.cssText='background:var(--surface);border-radius:14px;overflow:hidden;cursor:pointer;';c.innerHTML=`<div style="width:100%;aspect-ratio:16/10;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:2rem;">🎬</div><div style="padding:8px;">${esc(v.title||'видео')}</div>`;c.addEventListener('click',()=>openVideo(v));$('videoGrid').appendChild(c);});}
        function openVideo(v){const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:var(--bg);z-index:90;display:flex;flex-direction:column;max-width:430px;margin:0 auto;';ov.innerHTML=`<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);"><button class="icon-btn" id="cvf">←</button><span>🎬 видео</span></div><div style="flex:1;overflow-y:auto;padding:16px;"><video src="${v.media}" controls style="width:100%;border-radius:12px;"></video><div style="margin-top:12px;"><div style="display:flex;align-items:center;gap:10px;"><div class="avatar">${(v.un||'?')[0]}</div><div class="uname">@${esc(v.un)}</div></div><div class="actions" style="margin-top:12px;"><button class="act-btn lk-btn">🤍 ${v.likes||0}</button><button class="act-btn cmt-btn">💬 ${(v.comments||[]).length}</button></div></div></div>`;document.body.appendChild(ov);ov.querySelector('#cvf').addEventListener('click',()=>ov.remove());}

        function rb(){
            if(!bank[U.un])bank[U.un]={bal:100,cl:1,pl:0,hist:[]};
            const b=bank[U.un];
            $('bankView').innerHTML=`<div class="bank-bal"><div style="color:#93c5fd;">баланс</div><div style="font-size:3rem;font-weight:800;color:var(--gold);" id="bankBal">${b.bal.toLocaleString()} 🪙</div></div><div class="bank-click" id="bankClicker"><div style="font-size:3rem;">🪙</div><div>+${b.cl}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;"><div class="btn btn-o" id="bankUp" style="text-align:center;">улучшить<br><small>${(b.cl*2*50).toLocaleString()} 🪙</small></div><div class="btn btn-o" id="bankPas" style="text-align:center;">пассивный<br><small>${((b.pl+1)*100).toLocaleString()} 🪙</small></div></div>`;
            $('bankClicker').addEventListener('click',function(e){b.bal+=b.cl;b.hist.unshift({t:'клик',a:b.cl});sync();$('bankBal').textContent=b.bal.toLocaleString()+' 🪙';});
            $('bankUp').addEventListener('click',()=>{const c=b.cl*2*50;if(b.bal>=c){b.bal-=c;b.cl++;b.hist.unshift({t:'улучшение',a:-c});sync();rb();}});
            $('bankPas').addEventListener('click',()=>{const c=(b.pl+1)*100;if(b.bal>=c){b.bal-=c;b.pl++;b.hist.unshift({t:'пассивный',a:-c});sync();rb();}});
            if(b.pl>0){setInterval(()=>{if(bank[U.un]){bank[U.un].bal+=bank[U.un].pl;const be=$('bankBal');if(be)be.textContent=bank[U.un].bal.toLocaleString()+' 🪙';sync();}},1000);}
        }

        function rp(){
            if(!bank[U.un])bank[U.un]={bal:0,cl:1,pl:0};
            const mp=posts.filter(p=>p.un===U.un);const mv=vids.filter(v=>v.un===U.un);const b=bank[U.un];
            const mySubs=subs[U.un]||[];const followers=Object.entries(subs).filter(([k,v])=>v.includes(U.un)).length;
            $('profileView').innerHTML=`<div style="display:flex;align-items:center;gap:20px;padding:20px 0;"><div class="avatar" id="pav" style="width:100px;height:100px;font-size:2.8rem;"></div><div><div style="font-size:1.5rem;font-weight:700;">${esc(U.name)}</div><div style="color:var(--primary-light);">@${esc(U.un)}</div><button class="btn btn-o" id="pnot" style="margin-top:8px;padding:6px 12px;font-size:0.8rem;">🔔 ${N.filter(n=>n.unread).length}</button></div></div><div style="display:flex;justify-content:space-around;margin:20px 0;"><div class="stat-item" id="statPosts"><div style="font-size:1.4rem;font-weight:700;color:var(--primary-light);">${mp.length}</div><div style="font-size:0.7rem;">постов</div></div><div class="stat-item" id="statSubs"><div style="font-size:1.4rem;font-weight:700;color:var(--primary-light);">${mySubs.length}</div><div style="font-size:0.7rem;">подписок</div></div><div class="stat-item" id="statFollowers"><div style="font-size:1.4rem;font-weight:700;color:var(--primary-light);">${followers}</div><div style="font-size:0.7rem;">подписчиков</div></div><div class="stat-item"><div style="font-size:1.4rem;font-weight:700;color:var(--primary-light);">${b.bal.toLocaleString()}</div><div style="font-size:0.7rem;">🪙</div></div></div><div style="display:flex;gap:10px;margin:16px 0;"><button class="btn btn-p" id="pedit">редактировать</button><button class="btn btn-o" id="pset">настройки</button></div>`;
            av($('pav'),U);
            $('pedit').addEventListener('click',()=>{$('editName').value=U.name;$('editBio').value=U.bio||'';av($('editAv'),U);$('editProfileModal').classList.add('open');});
            $('pset').addEventListener('click',()=>go('settings'));
            $('pnot').addEventListener('click',()=>{$('notifList').innerHTML='';N.filter(n=>n.t===U.un).forEach(n=>{const d=document.createElement('div');d.style.cssText='padding:12px;background:var(--surface);border-radius:14px;margin-bottom:6px;';d.textContent=n.text;d.addEventListener('click',()=>{n.unread=false;sync();});$('notifList').appendChild(d);});$('notifModal').classList.add('open');});
            $('statSubs').addEventListener('click',()=>showUserList('подписки',mySubs));
            $('statFollowers').addEventListener('click',()=>showUserList('подписчики',Object.keys(All).filter(u=>subs[u]?.includes(U.un))));
        }
        $('closeNotif').addEventListener('click',()=>$('notifModal').classList.remove('open'));

        function showUserList(title,users){$('userListTitle').textContent=title;$('userListContent').innerHTML='';users.forEach(u=>{const ud=All[u];if(!ud)return;const d=document.createElement('div');d.style.cssText='padding:14px;background:var(--surface);border-radius:14px;margin-bottom:6px;cursor:pointer;';d.textContent='@'+u;d.addEventListener('click',()=>{$('userListModal').classList.remove('open');openCP(u);});$('userListContent').appendChild(d);});$('userListModal').classList.add('open');}
        $('closeUserList').addEventListener('click',()=>$('userListModal').classList.remove('open'));

        function rc(){$('chatList').innerHTML='';if(!C.length){$('chatList').innerHTML='<div style="text-align:center;padding:40px;">нет контактов</div>';return;}C.forEach(c=>{const ms=chats[c.id]||[];const d=document.createElement('div');d.style.cssText='padding:14px;background:var(--surface);border-radius:14px;margin-bottom:8px;cursor:pointer;';d.innerHTML=`<b>${esc(c.name)}</b> <span style="color:var(--primary-light);">@${esc(c.id)}</span><br><small style="color:var(--text-secondary);">${ms.length?ms[ms.length-1].text:'нет сообщений'}</small>`;d.addEventListener('click',()=>openChat(c.id));$('chatList').appendChild(d);});}
        function addC(un){if(!C.find(c=>c.id===un)&&All[un]){C.push({id:un,name:All[un].name,av:(All[un].name||un)[0]});if(!chats[un])chats[un]=[];}}
        function openChat(id){addC(id);cid=id;$('chatName').textContent=All[id]?.name||id;rCM();$('chatScreen').classList.add('open');}
        function rCM(){$('chatMessages').innerHTML='';if(!cid||!chats[cid])return;chats[cid].forEach(m=>{const b=document.createElement('div');b.className='msg '+(m.from===U.un?'out':'in');b.textContent=m.text;$('chatMessages').appendChild(b);});}
        function sendMsg(){const t=$('chatInput').value.trim();if(!t||!cid)return;if(!chats[cid])chats[cid]=[];chats[cid].push({from:U.un,text:t});$('chatInput').value='';sync();rCM();rc();}
        $('closeChat').addEventListener('click',()=>{$('chatScreen').classList.remove('open');cid=null;rc();});
        $('chatSend').addEventListener('click',sendMsg);
        $('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});

        function rs(){$('settingsView').innerHTML=`<h3 style="color:var(--primary-light);margin-bottom:24px;">настройки</h3><div style="padding:16px;background:var(--surface);border-radius:14px;margin-bottom:8px;cursor:pointer;" id="stTheme"><span>тема: ${theme==='dark'?'тёмная':'светлая'}</span></div><div style="padding:16px;background:var(--surface);border-radius:14px;margin-bottom:8px;cursor:pointer;" id="stLogout"><span style="color:var(--accent);">выйти</span></div>`;$('stTheme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';document.body.classList.toggle('light',theme==='light');localStorage.setItem('zc_theme',theme);rs();});$('stLogout').addEventListener('click',()=>{if(confirm('выйти?')){U=null;C=[];N=[];localStorage.removeItem('zc_session');location.reload();}});}

        $('fabBtn').addEventListener('click',()=>{$('postText').value='';$('postModal').classList.add('open');});
        $('cancelPost').addEventListener('click',()=>$('postModal').classList.remove('open'));
        $('publishPost').addEventListener('click',()=>{const t=$('postText').value.trim();if(!t)return;posts.push({id:'p'+Date.now(),un:U.un,text:t,time:'только что',ts:Date.now(),likes:0,lb:[],comments:[]});sync();$('postModal').classList.remove('open');go('feed');rf();});
        $('saveEdit').addEventListener('click',()=>{const n=$('editName').value.trim();if(!n)return;U.name=n;U.bio=$('editBio').value.trim();All[U.un]={...All[U.un],name:n,bio:U.bio};$('editProfileModal').classList.remove('open');sync();go('profile');});
        $('cancelEdit').addEventListener('click',()=>$('editProfileModal').classList.remove('open'));

        $("#loginBtn").addEventListener('click',()=>{const u=$('#loginUser').value.trim(),p=$('#loginPass').value.trim();if(!u||!p)return;const db=DB.load();All=db.users||{};posts=db.posts||[];vids=db.videos||[];chats=db.chats||{};bank=db.bank||{};subs=db.subs||{};const entry=Object.entries(All).find(([k,v])=>v.email===u||k===u);if(!entry||entry[1].pw!==p){$('#loginError').textContent='неверные данные';return;}U=entry[1];U.un=entry[0];C=U.contacts||[];N=U.notifs||[];$('#loginModal').classList.remove('open');go('feed');rf();rc();sync();});
        $("#regBtn").addEventListener('click',()=>{const n=$('#regName').value.trim()||'user',un=$('#loginUser').value.trim().toLowerCase(),pw=$('#loginPass').value.trim();if(!un||!pw)return;const db=DB.load();All=db.users||{};if(All[un]){$('#loginError').textContent='занято';return;}All[un]={name:n,email:un+'@zocial.local',pw:pw,ai:null,bio:'',contacts:[],notifs:[]};U=All[un];U.un=un;C=[];N=[];posts=db.posts||[];vids=db.videos||[];chats=db.chats||{};bank=db.bank||{};subs=db.subs||{};if(!bank[un])bank[un]={bal:100,cl:1,pl:0,hist:[]};sync();$('#loginModal').classList.remove('open');go('feed');rf();rc();});

        function renderAll(){const a=document.querySelector('.page.active');if(!a)return;if(a.id==='page-feed')rf();else if(a.id==='page-video')rv();else if(a.id==='page-bank')rb();else if(a.id==='page-chats')rc();else if(a.id==='page-profile')rp();else if(a.id==='page-settings')rs();}

        $('searchBtn').addEventListener('click',()=>{const q=prompt('поиск по никнейму:');if(!q)return;const u=Object.keys(All).find(k=>k.includes(q.toLowerCase()));if(u)openCP(u);else alert('не найден');});
        $('addContactBtn').addEventListener('click',()=>{const q=prompt('никнейм:');if(!q||!All[q]){alert('не найден');return;}addC(q);openChat(q);});

        (()=>{
            const st=localStorage.getItem('zc_theme');if(st==='light'){theme='light';document.body.classList.add('light');}
            const session=localStorage.getItem('zc_session');
            if(session){const db=DB.load();All=db.users||{};posts=db.posts||[];vids=db.videos||[];chats=db.chats||{};bank=db.bank||{};subs=db.subs||{};if(All[session]){U=All[session];U.un=session;C=U.contacts||[];N=U.notifs||[];go('feed');rf();rc();return;}}
            $('#loginModal').classList.add('open');
        })();
    })();
    </script>
</body>
</html>
